name: Release drafter

# Keeps the draft release notes updated on pushes to main. Publishing a
# release fires the release-comms webhook (Lab Team post).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# Releases queue without cancel so notes are never dropped mid-flight.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@67e173cadb2fbd3de94f4a861e0c48c913b462ae # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
